<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0907">
  <title>Trench Crusade × XCOM — Les Cloches de Saint-Ambroise</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0907'/%3E%3Cpath d='M14 4h4v9h9v4h-9v11h-4V17H5v-4h9z' fill='%23d8b45a'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game"></div>
  <div id="vignette"></div>
  <div id="hud" class="hidden">
    <div id="topbar">
      <div class="tb-left">
        <div id="turn-label" class="tb-turn">Tour 1 / 10</div>
        <div id="phase-label" class="tb-phase">NEW ANTIOCH</div>
      </div>
      <div class="tb-center">
        <div id="objective-label" class="tb-objective"></div>
      </div>
      <div class="tb-right">
        <div id="faith-pill" class="pill faith"><span class="pill-ico">✚</span><span id="faith-val">0</span></div>
        <div id="blood-pill" class="pill blood"><span class="pill-ico">☠</span><span id="blood-val">0</span></div>
        <button id="btn-menu" class="icon-btn" aria-label="menu">≡</button>
      </div>
    </div>
    <div id="banner" class="hidden"><div id="banner-text"></div><div id="banner-sub"></div></div>
    <div id="preview" class="hidden"></div>
    <div id="log"></div>
    <div id="bottom">
      <div id="unitcard" class="hidden">
        <div id="portrait"></div>
        <div class="uc-body">
          <div class="uc-name-row"><span id="uc-name"></span><span id="uc-ap"></span></div>
          <div class="uc-bars">
            <div class="bar hp"><div id="uc-hp-fill" class="fill"></div><span id="uc-hp-txt" class="bar-txt"></span></div>
          </div>
          <div id="uc-stats" class="uc-stats"></div>
          <div id="uc-status" class="uc-status"></div>
        </div>
      </div>
      <div id="actions"></div>
      <div id="bottom-row">
        <button id="btn-prev" class="nav-btn" aria-label="prev">◀</button>
        <button id="btn-next" class="nav-btn" aria-label="next">▶</button>
        <div class="spacer"></div>
        <button id="btn-cancel" class="ghost-btn hidden"></button>
        <button id="btn-endturn" class="end-btn"></button>
      </div>
    </div>
  </div>
  <div id="overlay" class="hidden"></div>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js" onerror="var s=document.createElement('script');s.src='lib/phaser.min.js';document.head.appendChild(s);"></script>
  <script src="src/i18n.js"></script>
  <script src="src/data.js"></script>
  <script src="src/mapdata.js"></script>
  <script src="src/art.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/rules.js"></script>
  <script src="src/ai.js"></script>
  <script src="src/hud.js"></script>
  <script src="src/scenes/boot.js"></script>
  <script src="src/scenes/menu.js"></script>
  <script src="src/scenes/battle.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
